<!doctype html>
<html lang="PL">
  <head>
    <title>Hosting</title>

    <link rel="stylesheet" href="./css/style.css" type="text/css" />
    <link rel="stylesheet" href="./css/register.css" type="text/css" />
    <script src="./js/jQuery.js"></script>
    <script src="./js/util.js"></script>
    <meta charset="UTF-8" />
  </head>
  <body>
    <header id="topbar"></header>
    <script src="./js/topbar.js"></script>
    <main>
      <div id="register-form">
        <div class="register-form-box">
          <div class="register-title">Zaloguj się</div>
          <div class="redirect">
            Nie posiadasz konta?
            <a href="register.html" target="_parent">Zarejestruj się</a>
          </div>
          <form id="login-form" class="form">
            <div>
              <div id="account-login-label" class="form-field-label">
                Nazwa użytkownika
              </div>
              <div class="form-field">
                <input
                  class="form-input"
                  type="text"
                  name="login"
                  minlength="4"
                  maxlength="32"
                  required
                  pattern="[a-zA-Z0-9]{4,}"
                  title="Nazwa użytkownika może zawierać od 4 do 32 znaków, oraz nie może zawierać znaków specjalnych."
                />
              </div>
            </div>
            <div>
              <div id="account-password-label" class="form-field-label">
                Hasło
              </div>
              <div class="form-field">
                <input
                  class="form-input"
                  type="password"
                  name="pass"
                  minlength="10"
                  maxlength="32"
                  required
                  pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&\(\)])[A-Za-z\d@$!%*?&\(\)]{10,}"
                  title="Hasło może zawierać od 10 do 32 znaków w tym conajmniej jednej: wielkiej litery, małej litery, cyfry oraz znaku specjalnego"
                />
              </div>
            </div>
            <div id="input-error"></div>
            <div>
              <input type="submit" class="form-field-submit" value="Zaloguj" />
            </div>
            <div class="redirect">
              <a href="resetpassword.html">Nie pamiętasz hasła?</a>
            </div>
          </form>
          <script src="./js/signin.js"></script>
        </div>
      </div>
    </main>
    <footer></footer>
  </body>
</html>
