<!doctype html>
<html lang="PL">
  <head>
    <title>Hosting</title>
    <link rel="stylesheet" href="./css/style.css" type="text/css" />
    <link rel="stylesheet" href="./css/register.css" type="text/css" />
    <script src="./js/jQuery.js"></script>
    <script src="./js/util.js"></script>
    <meta charset="UTF-8" />
  </head>

  <body>
    <header id="topbar"></header>
    <script src="./js/topbar.js"></script>
    <main>
      <div>
        <div class="register-form-box">
          <div class="register-title">Zarejestruj się</div>
          <div class="login-redirect">
            Masz już konto?
            <a href="login.html" target="_parent">Zaloguj się</a>
          </div>
          <form id="register-form" class="form">
            <div>
              <div id="account-email-label" class="form-field-label">
                Adres e-mail
              </div>
              <div class="form-field">
                <input
                  class="form-input"
                  name="email"
                  id="email"
                  autocomplete="email"
                  required
                  placeholder="example@email.com"
                />
              </div>
            </div>
            <div>
              <div id="account-login-label" class="form-field-label">
                Nazwa użytkownika
              </div>
              <div class="form-field">
                <input
                  class="form-input"
                  type="text"
                  name="login"
                  autocomplete="username"
                  minlength="4"
                  maxlength="32"
                  required
                  pattern="[a-zA-Z0-9]{4,}"
                  title="Nazwa użytkownika może zawierać od 4 do 32 znaków, oraz nie może zawierać znaków specjalnych."
                />
              </div>
            </div>
            <div>
              <div id="account-birthdate-label" class="form-field-label">
                Data urodzenia
              </div>
              <div class="form-field">
                <input
                  class="form-input"
                  type="date"
                  name="birthdate"
                  required
                />
              </div>
            </div>
            <div>
              <div id="account-password-label" class="form-field-label">
                Hasło
              </div>
              <div class="form-field">
                <input
                  class="form-input"
                  type="password"
                  name="pass"
                  minlength="10"
                  maxlength="32"
                  required
                  pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^a-zA-Z\d\s]).{10,}$"
                  title="Hasło może zawierać od 10 do 32 znaków w tym conajmniej jednej: wielkiej litery, małej litery, cyfry oraz znaku specjalnego"
                />
              </div>
            </div>
            <div>
              <div id="account-repeat-password-label" class="form-field-label">
                Powtórz hasło
              </div>
              <div class="form-field">
                <input
                  class="form-input"
                  type="password"
                  name="pass2"
                  minlength="10"
                  maxlength="32"
                  required
                  pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^a-zA-Z\d\s]).{10,}$"
                  title="Hasło może zawierać od 10 do 32 znaków w tym conajmniej jednej: wielkiej litery, małej litery, cyfry oraz znaku specjalnego"
                />
              </div>
            </div>
            <div>
              <div class="form-field">
                <input
                  id="TOS"
                  class="form-checkbox"
                  type="checkbox"
                  name="TOS"
                  required
                />
                <label class="form-field-label"
                  ><a href="TOS.html" target="_blank"
                    >Zasady użytkowania</a
                  ></label
                >
              </div>
            </div>
            <div>
              <div class="form-field">
                <input
                  id="privacy-policy"
                  class="form-checkbox"
                  type="checkbox"
                  name="PrivacyPolicy"
                  required
                />
                <label class="form-field-label"
                  ><a href="privacypolicy.html" target="_blank"
                    >Polityka prywatności</a
                  ></label
                >
              </div>
            </div>
            <div id="input-error"></div>
            <div>
              <input
                type="submit"
                class="form-field-submit"
                value="Zarejestruj"
              />
            </div>
          </form>
          <script src="./js/signin.js"></script>
        </div>
      </div>
    </main>
    <footer></footer>
  </body>
</html>
